events {
  worker_connections 1024;
}

http {
  upstream users         { server users-service:8080; }
  upstream products      { server products-service:8080; }
  upstream orders        { server orders-service:8080; }
  upstream shop          { server shop-service:8080; }
  upstream notifications { server notifications-service:8080; }
  upstream chat          { server chat-service:8080; }
  upstream web           { server frontend:80; }

  proxy_connect_timeout 10s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  server {
    listen 80;
    client_max_body_size 10M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/users         { proxy_pass http://users; }
    location /api/products      { proxy_pass http://products; }
    location /api/orders        { proxy_pass http://orders; }
    location /api/shops         { proxy_pass http://shop; }
    location /api/notifications { proxy_pass http://notifications; }

    location /ws/ {
      proxy_pass http://chat/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
