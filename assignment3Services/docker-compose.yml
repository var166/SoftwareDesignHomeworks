services:
  
  users-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: users
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - users-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  products-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: products
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - products-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  orders-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - orders-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  shop-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - shop-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  notifications-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app
    volumes:
      - notifications-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Application services =====
  users-service:
    build: ./users-service/users-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://users-db:3306/users
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}
    depends_on:
      users-db:
        condition: service_healthy

  products-service:
    build: ./products-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://products-db:3306/products
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
    depends_on:
      products-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-service:
    build: ./orders-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://orders-db:3306/orders
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  shop-service:
    build: ./shopService
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://shop-db:3306/shop
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}
    depends_on:
      shop-db:
        condition: service_healthy

  notifications-service:
    build: ./notifications-service
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://app:app@notifications-db:27017/notifications?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
    depends_on:
      notifications-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-andreivargamergelafacultateinfiecarezidinsaptamanamacar6orepezi}

  frontend:
    build: ./frontend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - users-service
      - products-service
      - orders-service
      - shop-service
      - notifications-service
      - chat-service
      - frontend

volumes:
  users-data:
  products-data:
  orders-data:
  shop-data:
  notifications-data:
